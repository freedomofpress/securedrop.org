---
networks:
  app:
services:
  postgresql:
    image: postgres:14
    ports:
      - "5432:5432"
    volumes:
      - ./:/django:ro
    environment:
      POSTGRES_PASSWORD: securedroppassword
      POSTGRES_USER: securedrop
      POSTGRES_DB: securedropdb
    user: postgres
    networks:
      app:
        aliases:
          - db

  node:
    build:
      context: .
      dockerfile: devops/docker/NodeDockerfile
      args:
        USERID: ${UID:?err}
    image: localhost/securedroporg-node
    volumes:
      - ./:/django:z
    working_dir: /django
    user: ${UID:?err}
    userns_mode: keep-id
    networks:
      - app

  django:
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: devops/docker/DevDjangoDockerfile
      args:
        USERID: ${UID:?err}
    image: localhost/securedroporg-django
    depends_on:
      - node
      - postgresql
    environment:
      DJANGO_DB_PASSWORD: securedroppassword
      DJANGO_DB_USER: securedrop
      DJANGO_DB_NAME: securedropdb
      DJANGO_DB_PORT: 5432
      DJANGO_DB_HOST: db
      DJANGO_XMLTEST_OUTPUT: "yes"
      DEPLOY_ENV: dev
      DJANGO_ONION_HOSTNAME: secrdrop5wyphb5x.onion
    working_dir: /django
    userns_mode: keep-id
    volumes:
      - ./:/django:z
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      app:
        aliases:
          - app
