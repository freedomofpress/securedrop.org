        \       </li>\n                    </ul>\n                </div>\n       \
        \     </header>\n            <main>\n                <article class=\"main-container\"\
        >\n                    <header class=\"\">\n                        <figure\
        \ class=\"cp-media cp-image\">\n                            <picture class=\"\
        u-full-width\">\n                                <img src=\"/tips/media/assets/images/story-top.jpg\"\
        \ alt=\"A man wearing a trench coat and fedora holds up a red envelope.\"\
        \ class=\"u-full-width u-height-auto\">\n                            </picture>\n\
        \                            <figcaption class=\"caption\">\n            \
        \                    <span class=\"caption__credit\">Max Pepper/CNN</span>\n\
        \                            </figcaption>\n                        </figure>\n\
        \                        <h1 class=\"hed\">Send a tip to CNN</h1>\n      \
        \                  <h2 class=\"dek\">How to share confidential story tips<br/>and\
        \ material with our journalists</h2>\n                        <div class=\"\
        cp-byline\">\n                            <div>\n                        \
        \        <p class=\"cp-byline__published\">\n                            \
        \        Published Dec. 2, 2019 at 12:00 p.m. ET</p>\n                   \
        \             <p class=\"cp-byline__updated\">Updated March 18, 2022 at 9:00\
        \ a.m. ET\n                                </p>\n                        \
        \    </div>\n                        </div>\n                    </header>\n\
        \                    <section>\n                        <p id=\"1\" data-element-id=\"\
        1\" class=\"cp-text\">Do you have a tip or sensitive material to share with\
        \ CNN? We offer several ways to reach our journalists.</p>\n             \
        \           <p id=\"2\" data-element-id=\"2\" class=\"cp-text\">We regularly\
        \ review submissions, but because we receive a large number, we cannot respond\
        \ to or investigate every tip.</p>\n                        <h2 id=\"3\" data-element-id=\"\
        3\" class=\"cp-header cp-header--title\">Anatomy of a good tip</h2>\n    \
        \                    <p id=\"4\" data-element-id=\"4\" class=\"cp-text\">Tips\
        \ should be newsworthy, meaning they concern systemic problems of timely and\
        \ broad public interest. The most compelling tips are those that can be corroborated\
        \ with documentation or evidence.</p>\n                        <p id=\"5\"\
        \ data-element-id=\"5\" class=\"cp-text\">These channels are not for press\
        \ releases. To share feedback about something you saw on CNN or CNN.com, use\
        \ <a href=\"https://www.cnn.com/feedback\" target=\"_blank\" rel=\"noopener\
        \ nofollow noreferrer\">our feedback form</a>.</p>\n                     \
        \   <h2 id=\"6\" data-element-id=\"6\" class=\"cp-header cp-header--title\"\
        >Before reaching out</h2>\n                        <p id=\"7\" data-element-id=\"\
        7\" class=\"cp-text\">Remember that no method is completely secure and what\
        \ measures you should take depend on how much anonymity you need. Before using\
        \ any of these apps or tools, consider taking a few extra security precautions,\
        \ including: considering whether the network you use can be used to identify\
        \ you or your activity; using a secure <a href=\"https://www.torproject.org/\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\">web browser</a> or\
        \ <a href=\"https://tails.boum.org/\" target=\"_blank\" rel=\"noopener nofollow\
        \ noreferrer\">operating system</a>; disabling features that back data up\
        \ to cloud services; and avoiding using accounts or devices linked to your\
        \ name, email or phone number.</p>\n                        <p id=\"8\" data-element-id=\"\
        8\" class=\"cp-text\">The <a href=\"https://freedom.press/training/\" target=\"\
        _blank\" rel=\"noopener nofollow noreferrer\">Freedom of the Press Foundation</a>\
        \ (FPF) offers more detailed guides aimed at maintaining privacy and anonymity.</p>\n\
        \                        <h2 id=\"9\" data-element-id=\"9\" class=\"cp-header\
        \ cp-header--title\"><i class=\"cnn-icon social email\"></i> Email</h2>\n\
        \                        <p id=\"10\" data-element-id=\"10\" class=\"cp-text\"\
        >Regular email is convenient but not secure. Do not use it if your information\
        \ is sensitive or if you are concerned about someone knowing that you are\
        \ a source.</p>\n                        <p id=\"11\" data-element-id=\"11\"\
        \ class=\"cp-text\">For more sensitive tips, you can send email encrypted\
        \ with Pretty Good Privacy (PGP). Be aware that while the content of PGP-encrypted\
        \ emails is secure, metadata \u2014 such as information about the sender or\
        \ recipient, time stamps and the subject \u2014 is not. Keep in mind that\
        \ many email providers retain your messages unless you direct otherwise.</p>\n\
        \                        <p id=\"12\" data-element-id=\"12\" class=\"cp-text\"\
        >Several browser extensions, such as <a href=\"https://www.mailvelope.com/\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\">Mailvelope</a>, <a\
        \ href=\"https://enigmail.net/index.php/\" target=\"_blank\" rel=\"noopener\
        \ nofollow noreferrer\">Enigmail</a> and <a href=\"https://flowcrypt.com/\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\">FlowCrypt</a>, make\
        \ it easy to use PGP with existing email providers, such as Gmail. You can\
        \ also use <a href=\"https://protonmail.com/\" target=\"_blank\" rel=\"noopener\
        \ nofollow noreferrer\">ProtonMail</a>, an email provider that supports PGP.</p>\n\
        \                        <p id=\"13\" data-element-id=\"13\" class=\"cp-text\"\
        >For additional anonymity, set up a dedicated email address to communicate\
        \ with us.</p>\n                        <p id=\"14\" data-element-id=\"14\"\
        \ class=\"cp-text\"><strong>Email address:</strong> <a href=\"mailto:tips@cnn.com\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\">tips@cnn.com</a></p>\n\
        \                        <p id=\"15\" data-element-id=\"15\" class=\"cp-text\"\
        ><strong>ProtonMail address:</strong> <a href=\"mailto:cnn.tips@protonmail.com\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\">cnn.tips@protonmail.com</a></p>\n\
        \                        <p id=\"16\" data-element-id=\"16\" class=\"cp-text\"\
        ><strong>Public key:</strong> <a href=\"https://api.protonmail.ch/pks/lookup?op=get&search=cnn.tips@protonmail.com\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\">B4BC 1138 6DD7 BB01\
        \ 801A 2594 0486 46F7 1E7B 788C</a></p>\n                        <p id=\"\
        17\" data-element-id=\"17\" class=\"cp-text\"><a href=\"https://protonmail.com/signup\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\" class=\"button button-filled\"\
        >Get ProtonMail</a> <a href=\"https://protonmail.com/security-details\" target=\"\
        _blank\" rel=\"noopener nofollow noreferrer\" class=\"button button-outlined\"\
        >Learn more</a> <a href=\"https://freedom.press/training/protonmail-pro/\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\" class=\"button button-outlined\"\
        >FPF guide</a></p>\n                        <!-- <h2 id=\"18\" data-element-id=\"\
        18\" class=\"cp-header cp-header--title\"><i class=\"cnn-icon signal\"></i>\
        \ Signal</h2>\n                        <p id=\"19\" data-element-id=\"19\"\
        \ class=\"cp-text\"><a href=\"https://signal.org\" target=\"_blank\" rel=\"\
        noopener nofollow noreferrer\">Signal</a> is a free app that allows users\
        \ to make and send encrypted calls and self-destructing text messages, images\
        \ and videos. The Signal Protocol is end-to-end encrypted, which means only\
        \ the sender and recipient can access the conversations. Signal does save\
        \ some information about you, including your phone number, when you signed\
        \ up and when you were last active, but stores no metadata about your communications.\
        \ By default, Signal saves your messages on your device unless you configure\
        \ them to self-destruct.</p>\n                        <p id=\"20\" data-element-id=\"\
        20\" class=\"cp-text\">For additional anonymity, consider setting up a dedicated\
        \ phone number to use with Signal. You can do this through several services,\
        \ such as <a href=\"https://voice.google.com/\" target=\"_blank\" rel=\"noopener\
        \ nofollow noreferrer\">Google Voice</a>, <a href=\"https://www.skype.com/en/skype-number/\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\">Skype</a> or <a href=\"\
        https://twilio.com\" target=\"_blank\" rel=\"noopener nofollow noreferrer\"\
        >Twilio</a>, or you can purchase a prepaid SIM card.</p>\n               \
        \         <p id=\"21\" data-element-id=\"21\" class=\"cp-text\"><strong>Number:</strong>\
        \ <a href=\"sgnl://signal.me/#p/+16463976705\" target=\"_blank\" rel=\"noopener\
        \ nofollow noreferrer\">+1 (646) 397-6705</a></p>\n                      \
        \  <p id=\"22\" data-element-id=\"22\" class=\"cp-text\"><a href=\"https://signal.org/install\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\" class=\"button button-filled\"\
        >Get Signal</a> <a href=\"https://support.signal.org/hc/en-us/sections/360001614191-Security-FAQ\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\" class=\"button button-outlined\"\
        >Learn more</a> <a href=\"https://freedom.press/training/locking-down-signal/\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\" class=\"button button-outlined\"\
        >FPF guide</a></p>\n                        <h2 id=\"23\" data-element-id=\"\
        23\" class=\"cp-header cp-header--title\"><i class=\"cnn-icon social whatsapp\"\
        ></i> WhatsApp</h2>\n                        <p id=\"24\" data-element-id=\"\
        24\" class=\"cp-text\"><a href=\"https://whatsapp.com\" target=\"_blank\"\
        \ rel=\"noopener nofollow noreferrer\">WhatsApp</a> is a free app that secures\
        \ phone calls and text messages using end-to-end encryption and allows you\
        \ to delete messages even after they\u2019ve been read. The app is <a href=\"\
        https://money.cnn.com/2014/02/19/technology/social/facebook-whatsapp/\" target=\"\
        _blank\" rel=\"noopener nofollow noreferrer\">owned by Meta</a>, which also\
        \ owns Facebook and Instagram, and retains a significant amount of metadata\
        \ about conversations. However, WhatsApp claims neither it, nor third parties,\
        \ can see users\u2019 private conversations.</p>\n                       \
        \ <p id=\"25\" data-element-id=\"25\" class=\"cp-text\">For additional anonymity,\
        \ consider setting up a dedicated phone number to use with WhatsApp. You can\
        \ do this through several services, such as <a href=\"https://voice.google.com/\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\">Google Voice</a>,\
        \ <a href=\"https://www.skype.com/en/skype-number/\" target=\"_blank\" rel=\"\
        noopener nofollow noreferrer\">Skype</a> or <a href=\"https://twilio.com\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\">Twilio</a>, or you\
        \ can purchase a prepaid SIM card.</p>\n                        <p id=\"26\"\
        \ data-element-id=\"26\" class=\"cp-text\"><strong>Number:</strong> <a href=\"\
        https://wa.me/16463976705\" target=\"_blank\" rel=\"noopener nofollow noreferrer\"\
        >+1 (646) 397-6705</a></p>\n                        <p id=\"27\" data-element-id=\"\
        27\" class=\"cp-text\"><a href=\"https://www.whatsapp.com/download\" target=\"\
        _blank\" rel=\"noopener nofollow noreferrer\" class=\"button button-filled\"\
        >Get WhatsApp</a> <a href=\"https://www.whatsapp.com/security\" target=\"\
        _blank\" rel=\"noopener nofollow noreferrer\" class=\"button button-outlined\"\
        >Learn more</a> <a href=\"https://freedom.press/training/upgrading-whatsapp-security/\"\
        \ target=\"_blank\" rel=\"noopener nofollow noreferrer\" class=\"button button-outlined\"\
        >FPF guide</a></p> -->\n                        <h2 id=\"33\" data-element-id=\"\
        33\" class=\"cp-header cp-header--title\"><i class=\"cnn-icon location\"></i>\
        \ Postal mail</h2>\n                        <p id=\"34\" data-element-id=\"\
        34\" class=\"cp-text\">Traditional first-class mail is still among the safest\
        \ ways to communicate securely.</p>\n                        <p id=\"35\"\
        \ data-element-id=\"35\" class=\"cp-text\">When sending tips through postal\
        \ mail, don\u2019t include a return address on the letter\u2019s face. (If\
        \ you\u2019d like us to be able to contact you, include your contact information\
        \ inside the letter.) Make sure any writing on the letter\u2019s face is typed,\
        \ not handwritten, and send your letter from a sidewalk mailbox and not your\
        \ home, workplace or a post office.</p>\n                        <p id=\"\
        36\" data-element-id=\"36\" class=\"cp-text\">Send mail to:</p>\n        \
        \                <blockquote id=\"37\" data-element-id=\"37\" class=\"cp-media\
        \ cp-blockquote\"><address>Tips<br>\u2105 CNN Investigates<br>30 Hudson Yards,\
        \ Fl 21<br>New York, NY 10001<br>United States of America</address></blockquote></blockquote>\n\
        \                    </section>\n                </article>\n            \n\
