        \            \"datePublished\": \"2019-12-02\",\n            \"dateCreated\"\
        : \"2019-12-02\",\n            \"dateModified\": \"2024-02-13\",\n       \
        \     \"description\": \"How to share confidential story tips and material\
        \ with CNN\u2019s journalists.\",\n            \"articleBody\": Do you have\
        \ a tip or sensitive material to share with CNN? We offer several ways to\
        \ reach our journalists. We regularly review submissions, but because we receive\
        \ a large number, we cannot respond to or investigate every tip. Anatomy of\
        \ a good tip Tips should be newsworthy, meaning they concern systemic problems\
        \ of timely and broad public interest. The most compelling tips are those\
        \ that can be corroborated with documentation or evidence. These channels\
        \ are not for press releases. To share feedback about something you saw on\
        \ CNN or CNN.com, use our feedback form. Before reaching out Remember that\
        \ no method is completely secure and what measures you should take depend\
        \ on how much anonymity you need. Before using any of these apps or tools,\
        \ consider taking a few extra security precautions, including: considering\
        \ whether the network you use can be used to identify you or your activity;\
        \ using a secure web browser or operating system; disabling features that\
        \ back data up to cloud services; and avoiding using accounts or devices linked\
        \ to your name, email or phone number. The Freedom of the Press Foundation\
        \ (FPF) offers more detailed guides aimed at maintaining privacy and anonymity.\
        \  Email Regular email is convenient but not secure. Do not use it if your\
        \ information is sensitive or if you are concerned about someone knowing that\
        \ you are a source. For more sensitive tips, you can send email encrypted\
        \ with Pretty Good Privacy (PGP). Be aware that while the content of PGP-encrypted\
        \ emails is secure, metadata \u2014 such as information about the sender or\
        \ recipient, time stamps and the subject \u2014 is not. Keep in mind that\
        \ many email providers retain your messages unless you direct otherwise. Several\
        \ browser extensions, such as Mailvelope, Enigmail and FlowCrypt, make it\
        \ easy to use PGP with existing email providers, such as Gmail. You can also\
        \ use ProtonMail, an email provider that supports PGP. For additional anonymity,\
        \ set up a dedicated email address to communicate with us. Email address:\
        \ tips@cnn.com ProtonMail address: cnn.tips@protonmail.com Public key: B4BC\
        \ 1138 6DD7 BB01 801A 2594 0486 46F7 1E7B 788C Get ProtonMail Learn more FPF\
        \ guide  Signal Signal is a free app that allows users to make and send encrypted\
        \ calls and self-destructing text messages, images and videos. The Signal\
        \ Protocol is end-to-end encrypted, which means only the sender and recipient\
        \ can access the conversations. Signal does save some information about you,\
        \ including your phone number, when you signed up and when you were last active,\
        \ but stores no metadata about your communications. By default, Signal saves\
        \ your messages on your device unless you configure them to self-destruct.\
        \ For additional anonymity, consider setting up a dedicated phone number to\
        \ use with Signal. You can do this through several services, such as Google\
        \ Voice, Skype or Twilio, or you can purchase a prepaid SIM card. Number:\
        \ +1 (646) 397-6705 Get Signal Learn more FPF guide  WhatsApp WhatsApp is\
        \ a free app that secures phone calls and text messages using end-to-end encryption\
        \ and allows you to delete messages even after they\u2019ve been read. The\
        \ app is owned by Meta, which also owns Facebook and Instagram, and retains\
        \ a significant amount of metadata about conversations. However, WhatsApp\
        \ claims neither it, nor third parties, can see users\u2019 private conversations.\
        \ For additional anonymity, consider setting up a dedicated phone number to\
        \ use with WhatsApp. You can do this through several services, such as Google\
        \ Voice, Skype or Twilio, or you can purchase a prepaid SIM card. Number:\
        \ +1 (646) 397-6705 Get WhatsApp Learn more FPF guide  Postal mail Traditional\
        \ first-class mail is still among the safest ways to communicate securely.\
        \ When sending tips through postal mail, don\u2019t include a return address\
        \ on the letter\u2019s face. (If you\u2019d like us to be able to contact\
        \ you, include your contact information inside the letter.) Make sure any\
        \ writing on the letter\u2019s face is typed, not handwritten, and send your\
        \ letter from a sidewalk mailbox and not your home, workplace or a post office.\
        \ Send mail to: Tips\u2105 CNN Investigates, 30 Hudson Yards, Fl 21, New York,\
        \ NY 10001, United States of America\n        }\n        </script>\n    </head>\n\
