    body:
      string: "<!doctype html>\n\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
        >\n\n  <title>2600 - SecureDrop</title>\n\n  <link rel=\"stylesheet\" href=\"\
        styles.css\">\n\n  <script src=\"scripts.js\"></script>\n\n</head>\n\n<body>\n\
        <div class=\"button link\" id=\"link-to-2600\">\n    <a href=\"https://www.2600.com\"\
        >2600</a>\n</div>\n<div class=\"main-content securedrop-info\" id=\"securedrop-generic-info\"\
        >\n    <h2>What is SecureDrop?</h2>\n\n    <p>SecureDrop is an anonymity tool\
        \ for journalists and whistleblowers. As a source, you can use our SecureDrop\
        \ installation to anonymously submit documents to our organization. Our journalists\
        \ use SecureDrop to receive source materials and securely communicate with\
        \ anonymous contacts.</p>\n\n    <h2>What should I know before submitting\
        \ material through SecureDrop?</h2>\n\n    <p>To protect your anonymity when\
        \ using SecureDrop, it is essential that you do not use a network or device\
        \ that can easily be traced back to your real identity. Instead, use public\
        \ wifi networks and devices you control.\n    </p>\n    <ul>\n        <li>Do\
        \ NOT access SecureDrop on your employer's network.</li>\n        <li>Do NOT\
        \ access SecureDrop using your employer's hardware.</li>\n        <li>Do NOT\
        \ access SecureDrop on your home network.</li>\n        <li>DO access SecureDrop\
        \ on a network not associated with you, like the wifi at a library or cafe.</li>\n\
        \    </ul>\n\n    <h2>Got it. How can I submit files and messages through\
        \ SecureDrop?</h2>\n\n    <p>Once you are connected to a public network at\
        \ a cafe or library, download and install the Tor Browser.</p>\n\n    <p>Launch\
        \ the Tor Browser. Visit our organization's unique SecureDrop URL at 2600.securedrop.tor.onion.\
        \ (The direct link is cy6wj77vryhcyh6go576hxycjz4wxlo4s5vevdinkw3armwzty5jozyd.onion.)\
        \ Follow the instructions you find on our source page to send us materials\
        \ and messages.</p>\n\n    <p>When you make your first submission, you will\
        \ receive a unique codename. Memorize it. If you write it down, be sure to\
        \ destroy the copy as soon as you've committed it to memory. Use your codename\
        \ to sign back in to our source page, check for responses from our journalists,\
        \ and upload additional materials.</p>\n\n    <h2>As a source, what else should\
        \ I know?</h2>\n\n    <p>No tool can absolutely guarantee your security or\
        \ anonymity. The best way to protect your privacy and anonymity as a source\
        \ is to adhere to best practices.</p>\n\n    <p>You can use a separate computer\
        \ you've designated specifically to handle the submission process. Or, you\
        \ can use an alternate operating system like Tails, which boots from a USB\
        \ stick and erases your activity at the end of every session.</p>\n\n    <p>A\
        \ file contains valuable metadata about its source - when it was created and\
        \ downloaded, what machine was involved, the machine's owner, etc. You can\
        \ scrub metadata from some files prior to submission using the Metadata Anonymization\
        \ Toolkit featured in Tails.</p>\n\n    <p>Your online behavior can be extremely\
        \ revealing. Regularly monitoring our publication's social media or website\
        \ can potentially flag you as a source. Take great care to think about what\
        \ your online behavior might reveal, and consider using Tor Browser to mitigate\
        \ such monitoring.</p>\n\n    <p>2600: The Hacker Quarterly retains strict\
        \ access control over our SecureDrop equipment. The staff within our organization\
        \ will be the only beings with access to SecureDrop submissions. We control\
        \ the server that stores your submissions, so no other entities have direct\
        \ access to the metadata or content of what you send us. In addition 2600.com\
        \ does not actively log user traffic, IPs, or other personally identifiable\
        \ data and thereby does not retain such information for any purpose ever.</p>\n\
        \n    <p>Do not discuss leaking or whistleblowing, even with trusted contacts.</p>\n\
        </div>\n</body>\n</html>\n"
