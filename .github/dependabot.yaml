version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'sunday'
    cooldown:
      default-days: 7

  - package-ecosystem: 'pre-commit'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'sunday'
    cooldown:
      default-days: 7
    ignore:
      # Keep ESLint on 9.x
      - dependency-name: '*mirrors-eslint*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@eslint/js'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 0 1 1,4,7,10 *'
    cooldown:
      default-days: 7
    allow:
      - dependency-type: 'all'
    commit-message:
      prefix: 'build'
      include: 'scope'
    ignore:
      - dependency-name: 'django'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'wagtail'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 0 1 1,4,7,10 *'
    cooldown:
      default-days: 7
    allow:
      - dependency-type: 'all'
    commit-message:
      prefix: 'build'
      include: 'scope'
    ignore:
      # Keep ESLint on 9.x
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@eslint/js'
        update-types:
          - 'version-update:semver-major'
