version: 2

multi-ecosystem-groups:
  ci-infrastructure:
    schedule:
      interval: 'weekly'
      day: 'sunday'

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    multi-ecosystem-group: 'ci-infrastructure'
    patterns: ['*']
    cooldown:
      default-days: 7

  - package-ecosystem: 'pre-commit'
    directory: '/'
    multi-ecosystem-group: 'ci-infrastructure'
    patterns: ['*']
    cooldown:
      default-days: 7
    ignore:
      # Keep ESLint on 9.x. ESLint 10 is incompatible with needed plugins:
      # eslint-plugin-react, eslint-plugin-jsx-a11y, eslint-plugin-import
      - dependency-name: '*mirrors-eslint*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@eslint/js'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 0 1 1,4,7,10 *'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 30
    allow:
      - dependency-type: 'all'
    commit-message:
      prefix: 'build'
      include: 'scope'
    ignore:
      - dependency-name: 'django'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'wagtail'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 0 1 1,4,7,10 *'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 30
    allow:
      - dependency-type: 'all'
    commit-message:
      prefix: 'build'
      include: 'scope'
    ignore:
      # Keep ESLint on 9.x. ESLint 10 is incompatible with needed plugins:
      # eslint-plugin-react, eslint-plugin-jsx-a11y, eslint-plugin-import
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@eslint/js'
        update-types:
          - 'version-update:semver-major'
