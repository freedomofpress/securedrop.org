---
name: CI

on:
  pull_request:
    types: ["opened", "synchronize"]
  push:
    branches: ["enp/github2"]

env:
  COMPOSE_FILE_DEV: docker-compose.yaml
  COMPOSE_FILE_PROD: prod-docker-compose.yaml

permissions:
  contents: read
  actions: read

jobs:
  lint-actions:
    name: Lint:Actions
    uses: freedomofpress/actionslib/.github/workflows/lint-actions.yaml@main
    permissions:
      contents: read
      actions: read

  build-dev:
    name: Build:Dev
    runs-on: ubuntu-latest
    steps:
    - name: Install Docker
      uses: docker/setup-docker-action@v4

    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Create env config
      run: make dev-init

    - name: Build
      run: docker compose --file=${{ env.COMPOSE_FILE_DEV }} build

    - name: Export built images
      run: |
        mkdir ${{ runner.temp }}/export
        docker image save --output ${{ runner.temp }}/export/securedrop-django.tar securedroporg-django
        docker image save --output ${{ runner.temp }}/export/securedrop-node.tar securedroporg-node

    - name: Upload built images
      uses: actions/upload-artifact@v4
      with:
        name: build-dev-${{ github.run_id }}-images
        path: ${{ runner.temp }}/export
        if-no-files-found: error
        overwrite: true
        retention-days: 1

    outputs:
      images: build-dev-${{ github.run_id }}-images

  build-prod:
    name: Build:Prod
    runs-on: ubuntu-latest
    #needs:
    #- build-dev  # no point trying a prod build if the dev fails
    steps:
    - name: Install Docker
      uses: docker/setup-docker-action@v4

    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        # The build inspects the local git environment for setting build time
        # parameters and will fail if they aren't available
        fetch-tags: true
        fetch-depth: 0

    - name: Build
      run: docker compose --file=${{ env.COMPOSE_FILE_PROD }} build

    - name: Start
      run: |
        docker compose --file=${{ env.COMPOSE_FILE_PROD }} up --detach
        sleep 5s

    - name: Verify django
      run: |
        docker run --pull=always --rm --network=securedroporg_app docker.io/curlimages/curl:7.80.0 \
        --ipv4 --retry 24 --retry-delay 5 --retry-all-errors http://django:8000/health/ok/

    - name: Verify database
      run: |
        docker compose --file=${{ env.COMPOSE_FILE_PROD }} exec django \
        /bin/bash -c "./manage.py createdevdata"

    - name: Export logs
      run: |
        mkdir --parents ${{ runner.temp }}/logs
        docker compose --file=${{ env.COMPOSE_FILE_PROD }} logs django >${{ runner.temp }}/logs/django.log
        docker compose --file=${{ env.COMPOSE_FILE_PROD }} logs postgresql >${{ runner.temp }}/logs/postgresql.log

    - name: Save logs
      uses: actions/upload-artifact@v4
      with:
        name: build-prod-${{ github.run_id }}-logs
        path: ${{ runner.temp }}/logs
        if-no-files-found: error
        overwrite: true
        retention-days: 10

  cleanup:
    name: Build:Cleanup
    runs-on: ubuntu-latest
    needs: 
    - build-dev
    if: ${{ needs.build-dev.result == 'success' }}
    permissions:
      contents: read
      actions: write
    steps:
    - name: Delete built images
      uses: freedomofpress/actionslib/act/delete-artifact@main
      with:
        artifact: ${{ needs.build-dev.outputs.images }}
        error-if-absent: 'false'
        github-token: ${{ secrets.GITHUB_TOKEN }}