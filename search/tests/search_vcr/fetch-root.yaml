        \          <div itemprop=\"articleBody\">\n             \n  <section id=\"welcome-to-securedrop-s-documentation\">\n<h1>Welcome
        to SecureDrop\u2019s documentation!<a class=\"headerlink\" href=\"#welcome-to-securedrop-s-documentation\"
        title=\"Link to this heading\">\uF0C1</a></h1>\n<p>SecureDrop is an open-source
        whistleblower submission system that media\norganizations can use to securely
        accept documents from and communicate with\nanonymous sources.</p>\n<p>This
        documentation is intended for sources, journalists, and administrators.\nIf
        you would like to contribute to SecureDrop, please see our\n<a class=\"reference
        external\" href=\"https://developers.securedrop.org/\">developer documentation</a>.</p>\n<div
        class=\"admonition note\">\n<p class=\"admonition-title\">Note</p>\n<p>This
        documentation is also available as a Tor Onion Service at\n<a class=\"reference
        external\" href=\"http://dftlffjdogaragaxkc6jqxpo77s7rrngimyoq7uuq3clowhmttblcoyd.onion/en/stable/\">http://dftlffjdogaragaxkc6jqxpo77s7rrngimyoq7uuq3clowhmttblcoyd.onion/en/stable/</a>.</p>\n</div>\n<section
        id=\"get-started\">\n<h2>Get Started<a class=\"headerlink\" href=\"#get-started\"
        title=\"Link to this heading\">\uF0C1</a></h2>\n<p><a class=\"reference internal\"
        href=\"what_is_securedrop.html\"><span class=\"doc\">I want to learn more
        about how SecureDrop works.</span></a></p>\n<p><a class=\"reference internal\"
        href=\"source/source.html\"><span class=\"doc\">I have information I want
        to share, and would like to learn how to do so safely.</span></a></p>\n<p><a
        class=\"reference internal\" href=\"admin/installation/installation_overview.html\"><span
        class=\"doc\">I am looking to set up a SecureDrop installation.</span></a></p>\n<p><a
        class=\"reference internal\" href=\"admin/deployment/getting_the_most_out_of_securedrop.html\"><span
        class=\"doc\">I have a SecureDrop installation and am interested in next steps.</span></a></p>\n<p><a
        class=\"reference internal\" href=\"journalist/journalist.html\"><span class=\"doc\">I
        am a journalist and would like information about how to best use this system.</span></a></p>\n<div
        class=\"toctree-wrapper compound\" id=\"overviewtoc\">\n</div>\n<div class=\"toctree-wrapper
        compound\" id=\"sourceguidetoc\">\n</div>\n<div class=\"toctree-wrapper compound\"
        id=\"journalistguidetoc\">\n</div>\n<div class=\"toctree-wrapper compound\"
        id=\"adminguidetoc\">\n</div>\n<div class=\"toctree-wrapper compound\" id=\"installtoc\">\n</div>\n<div
        class=\"toctree-wrapper compound\" id=\"deploymentguide\">\n</div>\n<div class=\"toctree-wrapper
        compound\" id=\"maintenance\">\n</div>\n<div class=\"toctree-wrapper compound\"
        id=\"upgradetoc\">\n</div>\n</section>\n<section id=\"get-involved\">\n<h2>Get
        Involved<a class=\"headerlink\" href=\"#get-involved\" title=\"Link to this
        heading\">\uF0C1</a></h2>\n<p>SecureDrop is an open source project. If you
        would like to contribute\nto SecureDrop, please see our\n<a class=\"reference
        external\" href=\"https://developers.securedrop.org/\">developer documentation</a>.</p>\n<p>Two
        versions of this documentation are available, and can be selected in the\nlower
        left corner using the version dropdown menu:</p>\n<ul class=\"simple\">\n<li><p><code
        class=\"docutils literal notranslate\"><span class=\"pre\">latest</span></code>
        - built from the <code class=\"docutils literal notranslate\"><span class=\"pre\">develop</span></code>
        branch of the SecureDrop\nrepository, containing updates that have been tested
        but not yet released.</p></li>\n<li><p><code class=\"docutils literal notranslate\"><span
        class=\"pre\">stable</span></code> - built from the <code class=\"docutils
        literal notranslate\"><span class=\"pre\">stable</span></code> branch of the
        SecureDrop repository,\nand up to date with the most recent release, 2.12.8.</p></li>\n</ul>\n</section>\n</section>\n\n\n
