[project]
name = "securedrop.org"
# Python version should match what's used in the Debian Stable container image.
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography>=50.0.0",
    "django-anymail[mailgun]>=15.0",
    "django-csp>=3.7",
    "django-modelcluster>=6.2.1",
    "django-settings-export",
    "django-storages[google]>=1.14.6",
    "django-webpack-loader",
    "Django>=5.2.13,<6.0",
    "djangorestframework",
    "factory_boy",
    "feedparser",
    "gunicorn>=26.0.0",
    "lxml>=6.1.1",
    "pillow>=12.3.0",
    "psycopg[binary]",
    "pygments>=2.20.0",
    "requests>=2.34.2",
    "structlog",
    "tinycss2",
    "tldextract",
    "unittest-xml-reporting",
    "wagtail-autocomplete>=0.12.0",
    "wagtail-factories>=4.5.0",
    "wagtail-honeypot",
    "wagtail-inventory",
    "wagtail-metadata>=5.0.0",
    "wagtail>=7.4.3,<8.0",
    "wagtailmedia>=0.14.5",
    "whitenoise",
]

[dependency-groups]
# Developer tooling, for testing and linting
dev = [
    "bandit>=1.7.7",
    "coverage",
    "django-debug-toolbar>=7.0.0",
    "ipdb>=0.13.9",
    "ruff",
    "vcrpy",
]
# Poetry itself, hash-pinned for the Containerfile's `lock` stage.
lock = [
    "poetry==2.5.1",
    "poetry-plugin-export==1.10.1",
]

[tool.poetry]
# We use pyproject to manage deps, not to organize an installable package.
package-mode = false

[tool.ruff]
exclude = [
    "node_modules",
]

# exclude RUF012 because it results in a lot of false positives in Django code,
# especially in migrations
[tool.ruff.lint]
ignore = ["E501", "E266", "RUF012"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["blog", "cloudflare", "common", "directory", "forms", "github", "home", "marketing", "menus", "scanner", "search", "simple"]
section-order = [
    # the default, plus our Django and Wagtail sections
    "future",
    "standard-library",
    "django",
    "wagtail",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
"wagtail" = ["wagtail"]

[tool.pre-commit-update.yaml]
mapping = 2
sequence = 4
offset = 2
