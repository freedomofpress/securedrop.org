[project]
name = "securedrop.org"
version = "0.1.0"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "cryptography (>=49.0.0)",
    "django-anymail[mailgun] (>=15.0)",
    "django-csp (>=3.7)",
    "django-modelcluster (>=6.2.1)",
    "django-settings-export",
    "django-storages[google] (>=1.14.6)",
    "django-webpack-loader",
    "django (>=5.2.13,<6.0)",
    "djangorestframework",
    "factory-boy",
    "feedparser",
    "gunicorn (>=26.0.0)",
    "lxml (>=6.1.1)",
    "pillow (>=12.3.0)",
    "psycopg[binary]",
    "pygments (>=2.20.0)",
    "requests (>=2.34.2)",
    "structlog",
    "tinycss2",
    "tldextract",
    "unittest-xml-reporting",
    "wagtail-autocomplete (>=0.12.0)",
    "wagtail-factories (>=4.5.0)",
    "wagtail-honeypot",
    "wagtail-metadata (>=5.0.0)",
    "wagtail (>=7.4.2,<8.0)",
    "wagtailmedia (>=0.14.5)",
    "whitenoise",
]

[tool.poetry]
packages = [{include = "securedrop"}]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
    "node_modules",
    "molecule",
]

[tool.ruff.lint]
ignore = ["E501", "E266"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["statistics"]
section-order = [
    # the default, plus our Django and Wagtail sections
    "future",
    "standard-library",
    "django",
    "wagtail",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
"wagtail" = ["wagtail"]

[tool.pre-commit-update.yaml]
mapping = 2
sequence = 4
offset = 2

[tool.bandit]
exclude_dirs = [".venv", "/venv", "node_modules", "devops"]

[dependency-groups]
dev = [
    "bandit (>=1.7.7)",
    "colorama (<1)",
    "coverage (>=7.14.3,<8.0.0)",
    "django-debug-toolbar (>=1.11.1)",
    "ipdb (>=0.13.9)",
    "vcrpy (>=8.2.1,<9.0.0)",
    "ruff (>=0.15.20,<0.16.0)",
]

poetry = [
    "poetry ==2.4.1",
    "poetry-core >=2.0,<3.0",
    "poetry-plugin-export >=1,<2",
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10,<2"
