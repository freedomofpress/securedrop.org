[project]
name = "securedrop.org"
requires-python = ">=3.14"

[tool.ruff]
exclude = [
    "node_modules",
]

[tool.ruff.lint]
ignore = ["E501", "E266", "RUF012"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["statistics"]
section-order = [
    # the default, plus our Django and Wagtail sections
    "future",
    "standard-library",
    "django",
    "wagtail",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
"wagtail" = ["wagtail"]

[tool.pre-commit-update.yaml]
mapping = 2
sequence = 4
offset = 2
